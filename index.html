<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مِعمار — أوفيس كامل + منشئ مواقع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;700&family=Tajawal:wght@400;500;700;800&family=Cairo:wght@400;600;800&family=Almarai:wght@400;700;800&family=Changa:wght@400;600;800&family=Amiri:wght@400;700&family=Lalezar:wght@400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root{--bg:#0D0E0B;--panel:#12140C;--panel2:#171A0F;--line:#24281A;--line2:#31361F;--ink:#EDEEE2;--dim:#8B8F79;--acc:#D6FB41;--acc-ink:#161802;--red:#E0654F;--ok:#7BC96A;--blu:#5B9BD5}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button,input,textarea,select{font-family:inherit;color:inherit}
.hidden{display:none!important}
.view{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:#2B2F1E;border-radius:7px}::-webkit-scrollbar-track{background:transparent}
svg{flex:none}

/* دخول + قفل (زي السابق) */
#authGate{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;background-image:radial-gradient(circle,#191C10 1px,transparent 1px);background-size:22px 22px}
.a-box{width:min(400px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:28px 26px 22px;text-align:center;margin:auto}
.a-logo{width:46px;height:46px;background:var(--acc);border-radius:12px;display:grid;place-items:center;margin:0 auto 12px}
.a-logo svg{width:24px;height:24px;stroke:var(--acc-ink);fill:none;stroke-width:2.2;stroke-linecap:square}
.a-box h1{font-size:22px;font-weight:800}
.a-sub{font-size:12.5px;color:var(--dim);margin:4px 0 12px}
.a-mode{font-size:10.5px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 12px;display:inline-block;margin-bottom:14px}
.a-tabs{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;margin-bottom:14px}
.a-tab{flex:1;background:none;border:none;padding:9px;font-size:13px;color:var(--dim);cursor:pointer}
.a-tab.on{background:var(--acc);color:var(--acc-ink);font-weight:700}
.a-field{margin-bottom:11px;text-align:start}
.a-field label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px}
.a-field input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:10px 12px;font-size:14px}
.a-field input:focus{outline:none;border-color:var(--acc)}
.a-remember{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);margin-bottom:8px;cursor:pointer}
.a-remember input{accent-color:var(--acc)}
.a-reset{background:none;border:none;color:var(--blu);font-size:11.5px;cursor:pointer;text-decoration:underline;margin-bottom:10px;padding:0}
.a-err{display:none;background:rgba(224,101,79,.1);color:#E8917F;border:1px solid rgba(224,101,79,.3);border-radius:8px;padding:8px 11px;font-size:12px;margin-bottom:10px;text-align:start;line-height:1.7}
.a-btn{width:100%;background:var(--acc);color:var(--acc-ink);border:none;font-weight:800;font-size:14.5px;padding:12px;border-radius:10px;cursor:pointer}
.a-btn:disabled{opacity:.5;cursor:wait}
.a-guest{width:100%;background:none;border:1px dashed var(--line2);border-radius:10px;padding:10px;margin-top:10px;font-size:12.5px;color:var(--dim);cursor:pointer}
.a-guest:hover{color:var(--acc);border-color:var(--acc)}
.a-note{font-size:10.5px;color:var(--dim);margin-top:14px;line-height:1.8}
#lockScreen{position:fixed;inset:0;z-index:450;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.l-box{width:min(340px,100%);text-align:center;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:30px 26px}
.l-av{width:64px;height:64px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font:800 26px 'Space Grotesk';margin:0 auto 12px}
.l-box b{font-size:18px;display:block}
.l-box p{font-size:12.5px;color:var(--dim);margin:6px 0 16px;line-height:1.8}
.l-box input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:10px 12px;font-size:14px;margin-bottom:10px;direction:ltr;text-align:center}
.l-out{background:none;border:none;color:var(--dim);font-size:12px;margin-top:12px;cursor:pointer;text-decoration:underline}
.l-out:hover{color:var(--red)}

/* أزرار عامة */
.hbtn{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:7px;border:1px solid var(--line2);background:transparent;font-size:11.5px;font-weight:500;cursor:pointer;transition:.2s}
.hbtn:hover:not(.acc):not(.danger){border-color:var(--acc);color:var(--acc)}
.hbtn.danger{border-color:rgba(224,101,79,.4);color:#E8917F}
.hbtn.danger:hover{border-color:var(--red);color:var(--red)}
.hbtn.acc{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700;padding:6px 14px}
.hbtn svg{width:12px;height:12px}
.grow{flex:1}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:5px;background:none;border:1px solid var(--line2);border-radius:6px;padding:5px 9px;font-size:11px;color:var(--dim);cursor:pointer}
.ghost:hover{color:var(--acc);border-color:var(--acc)}
.ghost svg{width:10px;height:10px}

#toasts{position:fixed;bottom:16px;inset-inline-start:16px;z-index:300;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-inline-start:3px solid var(--acc);padding:9px 14px;border-radius:8px;font-size:11.5px;opacity:0;transform:translateY(8px);transition:.25s ease}
.toast.err{border-inline-start-color:var(--red)}
.toast.on{opacity:1;transform:none}
</style>
</head>
<body>

<div id="authGate">
  <div class="a-box">
    <div class="a-logo"><svg viewBox="0 0 24 24"><path d="M8 4H4v4M16 20h4v-4M4 20l6-6M20 4l-6 6"/><rect x="10.2" y="10.2" width="3.6" height="3.6" fill="currentColor" stroke="none"/></svg></div>
    <h1>مِعمار</h1>
    <p class="a-sub">أوفيس كامل + منشئ مواقع — سجّل دخولك</p>
    <div class="a-mode" id="aMode">…</div>
    <div class="a-tabs">
      <button class="a-tab" data-at="login">تسجيل الدخول</button>
      <button class="a-tab" data-at="signup">إنشاء حساب</button>
    </div>
    <form id="aForm" novalidate>
      <div class="a-field hidden" id="fName"><label>الاسم</label><input type="text" id="aName" placeholder="اسمك" autocomplete="name"></div>
      <div class="a-field"><label>البريد الإلكتروني</label><input type="email" id="aEmail" placeholder="you@mail.com" dir="ltr" autocomplete="email"></div>
      <div class="a-field"><label>كلمة المرور</label><input type="password" id="aPass" placeholder="••••••••" dir="ltr" autocomplete="current-password"></div>
      <div class="a-field hidden" id="fPass2"><label>تأكيد كلمة المرور</label><input type="password" id="aPass2" placeholder="••••••••" dir="ltr" autocomplete="new-password"></div>
      <label class="a-remember"><input type="checkbox" id="aRemember" checked> تذكرني على هذا الجهاز</label>
      <div><button class="a-reset" id="aReset" type="button">نسيت كلمة المرور؟</button></div>
      <div class="a-err" id="aErr"></div>
      <button class="a-btn" type="submit" id="aSubmit">دخول</button>
    </form>
    <button class="a-guest" id="aGuest" type="button">الدخول كزائر — بدون حساب</button>
    <p class="a-note">كل حساب ليه مساحة عمل منفصلة.<br>الزائر يُحفظ شغله محليًا على جهازه فقط.</p>
  </div>
</div>

<div id="lockScreen" class="hidden">
  <div class="l-box">
    <div class="l-av" id="lAv">؟</div>
    <b id="lName"></b>
    <p>الشاشة مقفولة — أدخل كلمة المرور للمتابعة</p>
    <input type="password" id="lPass" placeholder="كلمة المرور" autocomplete="current-password">
    <div class="a-err" id="lErr"></div>
    <button class="a-btn" id="lUnlock" type="button">فتح</button>
    <button class="l-out" id="lLogout" type="button">تسجيل الخروج من الحساب</button>
  </div>
</div>

<div id="toasts"></div>

<script>
window.addEventListener('error', function (ev) {
  try {
    var t = document.createElement('div');
    t.className = 'toast err on';
    t.textContent = '⚠ خطأ تقني: ' + (ev.message || '');
    var host = document.getElementById('toasts');
    if (host) {
      host.appendChild(t);
      setTimeout(function () { t.remove(); }, 6000);
    }
  } catch (e) {}
});

const FIREBASE_CONFIG = { apiKey: '', authDomain: '', projectId: '', appId: '' };
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const safeRun = (fn, fallback) => {
  try {
    return typeof fn === 'function' ? fn() : null;
  } catch (err) {
    console.error(err);
    return typeof fallback === 'function' ? fallback(err) : null;
  }
};
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const j = JSON.stringify;
function icons() {
  try {
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }
  } catch (e) {}
}
function norm(t) {
  return String(t || '').replace(/[\u064B-\u0652\u0670]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').toLowerCase();
}
function hx(h) {
  h = String(h || '').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}
function lum(h) {
  try {
    const [r, g, b] = hx(h);
    return (.2126 * r + .7152 * g + .0722 * b) / 255;
  } catch (e) {
    return 0;
  }
}
function mix(a, b, t) {
  try {
    const A = hx(a), B = hx(b), to = v => Math.max(0, Math.min(255, Math.round(v)));
    return '#' + [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t].map(to).map(v => v.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    return '#000000';
  }
}
function inkFor(bg) {
  return lum(bg) >= 0.5 ? '#20211B' : '#F4F3EA';
}
function styleAttr(o) {
  return Object.entries(o).filter(([, v]) => v !== undefined && v !== null && v !== '').map(([k, v]) => k + ':' + v).join(';');
}
function toast(m, isErr) {
  const host = document.getElementById('toasts');
  if (!host) return;
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = m;
  host.appendChild(t);
  requestAnimationFrame(() => t.classList.add('on'));
  setTimeout(() => { t.remove(); }, 6000);
}
function download(name, content, type) {
  try {
    const blob = new Blob([content], { type: type || 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {
    console.error(e);
  }
}

let FB = null, CLOUD = false;
function fbLoad(cb) {
  if (!FIREBASE_CONFIG.apiKey || !window.firebase) {
    cb(false);
    return;
  }
  if (window.firebase.apps && window.firebase.apps.length) {
    FB = { auth: window.firebase.auth(), db: window.firebase.firestore() };
    cb(true);
    return;
  }
  let done = false;
  const finish = v => { if (!done) { done = true; cb(v); } };
  const timer = setTimeout(() => finish(false), 8000);
  try {
    window.firebase.initializeApp(FIREBASE_CONFIG);
    FB = { auth: window.firebase.auth(), db: window.firebase.firestore() };
    clearTimeout(timer);
    finish(true);
  } catch (e) {
    clearTimeout(timer);
    finish(false);
  }
}
function fbErr(e) {
  const c = (e && e.code) || '';
  if (c.indexOf('email-already-in-use') > -1) return 'البريد مستخدم بالفعل — سجّل دخول';
  if (c.indexOf('invalid-email') > -1) return 'البريد مش صحيح';
  if (c.indexOf('weak-password') > -1) return 'كلمة المرور ضعيفة — 6 حروف على الأقل';
  if (c.indexOf('user-not-found') > -1) return 'مفيش حساب بالبريد ده';
  if (c.indexOf('wrong-password') > -1 || c.indexOf('invalid-credential') > -1) return 'البريد أو كلمة المرور غلط';
  if (c.indexOf('too-many-requests') > -1) return 'محاولات كتير — استنى دقيقة';
  if (c.indexOf('network') > -1) return 'مشكلة إنترنت';
  if (c.indexOf('operation-not-allowed') > -1) return 'فعّل Email/Password من Firebase Console';
  if (c.indexOf('unauthorized-domain') > -1) return 'أضف نطاقك في Authentication → Authorized domains';
  return 'خطأ: ' + ((e && e.message) || c || 'غير معروف');
}

function cloudRef() {
  return FB && FB.db && FB.auth && FB.auth.currentUser ? FB.db.collection('users').doc(FB.auth.currentUser.uid) : null;
}
let cloudSaveT = null, cloudWarned = false;
function cloudSave(col, data) {
  clearTimeout(cloudSaveT);
  cloudSaveT = setTimeout(async () => {
    if (!CLOUD || !FB || !FB.auth || !FB.auth.currentUser) return;
    try {
      const ref = cloudRef();
      if (ref) await ref.set({ [col]: data, updated: Date.now() }, { merge: true });
    } catch (e) {
      if (!cloudWarned) {
        cloudWarned = true;
        toast('تعذر الحفظ السحابي — محفوظ محليًا كمان', true);
      }
    }
  }, 1200);
}
async function cloudGet(col) {
  if (!CLOUD || !FB || !FB.auth || !FB.auth.currentUser) return null;
  try {
    const ref = cloudRef();
    if (!ref) return null;
    const d = await ref.get();
    if (d.exists && d.data() && d.data()[col]) return d.data()[col];
  } catch (e) {}
  return null;
}

const Auth = {
  users() {
    try { return JSON.parse(localStorage.getItem('miemar_users') || '[]'); } catch (e) { return []; }
  },
  saveUsers(u) {
    try { localStorage.setItem('miemar_users', j(u)); } catch (e) {}
  },
  hash(s) {
    let h = 5381; s = String(s);
    for (let i = 0; i < s.length; i++) {
      h = (((h << 5) + h) >>> 0) + s.charCodeAt(i) >>> 0;
    }
    return 'h' + h.toString(36) + '.' + s.length;
  },
  session() {
    try { return JSON.parse(sessionStorage.getItem('miemar_sess') || localStorage.getItem('miemar_sess') || 'null'); } catch (e) { return null; }
  },
  setSession(s, remember) {
    try {
      if (remember) {
        localStorage.setItem('miemar_sess', j(s));
        sessionStorage.removeItem('miemar_sess');
      } else {
        sessionStorage.setItem('miemar_sess', j(s));
        localStorage.removeItem('miemar_sess');
      }
    } catch (e) {}
  },
  clear() {
    try {
      localStorage.removeItem('miemar_sess');
      sessionStorage.removeItem('miemar_sess');
    } catch (e) {}
  },
  current() {
    const s = this.session();
    if (!s) return null;
    if (s.guest) return { name: 'زائر', email: '', guest: true };
    const u = this.users().find(x => x.email === s.email);
    return u ? { name: u.name, email: u.email, guest: false } : null;
  }
};
function ukey(suffix) {
  const u = AuthAPI.current();
  const id = (u && !u.guest && u.email) ? u.email.replace(/[^a-zA-Z0-9]/g, '_') : 'guest';
  return 'miemar_' + suffix + '_' + id;
}
const AuthAPI = {
  mode: 'local',
  current() {
    if (this.mode === 'cloud' && FB && FB.auth && FB.auth.currentUser) {
      const u = FB.auth.currentUser;
      return { name: u.displayName || (u.email ? u.email.split('@')[0] : 'مستخدم'), email: u.email || '', guest: false };
    }
    return Auth.current();
  },
  async signup(name, email, pass, remember) {
    if (this.mode === 'cloud') {
      try {
        if (!remember) await FB.auth.setPersistence(window.firebase.auth.Auth.Persistence.SESSION);
        const cred = await FB.auth.createUserWithEmailAndPassword(email, pass);
        if (cred && cred.user) {
          try { await cred.user.updateProfile({ displayName: name }); } catch (e) {}
        }
        return { ok: true };
      } catch (e) {
        return { ok: false, msg: fbErr(e) };
      }
    }
    const users = Auth.users();
    if (users.find(u => u.email === email)) return { ok: false, msg: 'الحساب موجود على هذا الجهاز — سجّل دخول' };
    users.push({ name: name, email: email, pass: Auth.hash(pass), created: Date.now() });
    Auth.saveUsers(users);
    Auth.setSession({ email: email }, remember);
    return { ok: true };
  },
  async login(email, pass, remember) {
    if (this.mode === 'cloud') {
      try {
        if (!remember) await FB.auth.setPersistence(window.firebase.auth.Auth.Persistence.SESSION);
        await FB.auth.signInWithEmailAndPassword(email, pass);
        return { ok: true };
      } catch (e) {
        return { ok: false, msg: fbErr(e) };
      }
    }
    const u = Auth.users().find(u => u.email === email);
    if (!u) return { ok: false, msg: 'مفيش حساب بالبريد ده على هذا الجهاز' };
    if (u.pass !== Auth.hash(pass)) return { ok: false, msg: 'كلمة المرور غلط' };
    Auth.setSession({ email: email }, remember);
    return { ok: true };
  },
  async reset(email) {
    if (this.mode !== 'cloud') return { ok: false, msg: 'متاح في الوضع السحابي فقط' };
    try {
      await FB.auth.sendPasswordResetEmail(email);
      return { ok: true };
    } catch (e) {
      return { ok: false, msg: fbErr(e) };
    }
  },
  async reauth(pass) {
    if (this.mode === 'cloud') {
      try {
        const c = window.firebase.auth.EmailAuthProvider.credential(FB.auth.currentUser.email, pass);
        await FB.auth.currentUser.reauthenticateWithCredential(c);
        return true;
      } catch (e) {
        return false;
      }
    }
    const sess = Auth.session();
    if (!sess || !sess.email) return false;
    const u = Auth.users().find(x => x.email === sess.email);
    return !!(u && u.pass === Auth.hash(pass));
  },
  async logout() {
    if (this.mode === 'cloud' && FB && FB.auth) {
      try { await FB.auth.signOut(); } catch (e) {}
    }
    Auth.clear();
  }
};
</script>
</body>
</html>
